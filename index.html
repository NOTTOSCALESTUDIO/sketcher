<style>
:root{--ui:#1f2328;--muted:#5b636b;--line:#d0d7de;--bg:#f6f7f8;--accent:#0b63ce;--accentbg:#e7f0fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ui);background:var(--bg)}
#app{display:grid;grid-template-columns:64px 1fr 290px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.brand{font-weight:600;margin-right:8px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{background:#f3f4f6}
button.primary{background:var(--ui);color:#fff;border-color:var(--ui)}
button.primary:hover{background:#000}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
#status{margin-left:auto;color:var(--muted);font-size:12px}
#tools{grid-row:2;display:flex;flex-direction:column;gap:4px;padding:6px;border-right:1px solid var(--line);background:#fff;overflow-y:auto}
#tools button{width:52px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
#tools button svg{width:22px;height:22px}
#tools button.on{background:var(--accentbg);border-color:var(--accent)}
#stage{grid-row:2;position:relative;overflow:hidden}
#svg{width:100%;height:100%;display:block;background:#dfe2e6;touch-action:none;cursor:default}
#svg.drawing{cursor:crosshair}
#svg.panning{cursor:grabbing}
#tabs{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
#tabs button{pointer-events:auto;min-height:28px;padding:3px 10px;font-size:12px;background:rgba(255,255,255,.92);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs button.on{background:var(--ui);color:#fff;border-color:var(--ui)}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.88);padding:3px 8px;border-radius:6px;pointer-events:none}
#panel{grid-row:2;border-left:1px solid var(--line);background:#fff;overflow-y:auto;padding:12px 14px}
#panel h2{font-size:14px;margin:0 0 10px}
#panel h3{font-size:12px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:inherit}
textarea{resize:vertical;min-height:44px;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btns button{flex:1 1 40%}
.note{font-size:12px;color:var(--muted);margin:6px 0}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fafafa}
#printArea{display:none}
@page land{size:letter landscape;margin:0}
@page port{size:letter portrait;margin:0}
@page tland{size:17in 11in;margin:0}
@page tport{size:11in 17in;margin:0}
@page{margin:0}
@media print{
  html,body{background:#fff;height:auto}
  #app{display:none!important}
  #printArea{display:block}
  #printArea svg{display:block}
  .pg.land{page:land;width:11in;height:8.5in}
  .pg.port{page:port;width:8.5in;height:11in}
  .pg.tland{page:tland;width:17in;height:11in}
  .pg.tport{page:tport;width:11in;height:17in}
  .pg:not(:last-child){break-after:page}
}
</style>

<body>
<div id="app">
<header>
  <span class="brand">Blueprint Sketcher</span>
  <button data-act="new">New</button>
  <button data-act="open">Open…</button>
  <button data-act="save" title="Ctrl+S">Save</button>
  <span class="sep"></span>
  <button data-act="undo" title="Ctrl+Z">Undo</button>
  <button data-act="redo" title="Ctrl+Y">Redo</button>

  <button data-act="zoomout" aria-label="Zoom out">−</button>
  <button data-act="fit">Fit</button>
  <button data-act="zoomin" aria-label="Zoom in">+</button>
  <span class="sep"></span>
  <button data-act="pdf" title="All sheets, 300 dpi">Download PDF</button>
  <button data-act="dxf" title="Current sheet, for CAD">Export DXF</button>
  <button data-act="svg" title="Current sheet">SVG</button>

</main>
<aside id="panel"></aside>
</div>

(function(){

/* ---------- constants ---------- */
const INK = '#111111';
const FONT = "'IBM Plex Mono', ui-monospace, Consolas, 'Courier New', monospace";
const FILLS = {none:null, white:'#ffffff', light:'#efefef', dark:'#d2d2d2', hatch:'url(#bp-hatch)'};
const BOX_TYPES = ['booth','fixture','zone','hatch'];
const DEFAULTS = {
  booth:   {w:160,h:96, stroke:'solid', fill:'light', weight:2,   label:'BOOTH',      fontSize:14, bold:true,  vertical:false, rot:0},
  fixture: {w:48, h:24, stroke:'solid', fill:'dark',  weight:1.5, label:'',           fontSize:10, bold:false, vertical:false, rot:0},
  zone:    {w:120,h:80, stroke:'dashed',fill:'none',  weight:1.5, label:'ZONE',       fontSize:11, bold:false, vertical:false, rot:0},
  hatch:   {w:160,h:40, stroke:'solid', fill:'hatch', weight:2,   label:'KEEP CLEAR', fontSize:11, bold:true,  vertical:false, rot:0},
  line:    {stroke:'solid', weight:2},
  text:    {label:'TEXT', fontSize:12, bold:false, rot:0},
  door:    {w:32, h:32, rot:0, flip:false, double:false, cut:true},
  opening: {w:32, h:8, rot:0},
  dim:     {label:''}
};
const LEGEND_NAMES = {
  booth:'BOOTH / ENCLOSURE', fixture:'CABINET / FIXTURE', zone:'ZONE / TBD SPACE', hatch:'KEEP-CLEAR LANE',
  wall:'WALL', line:'LINE', dashed:'DASHED LINE', door:'SWING DOOR', opening:'OPEN DOORWAY', dim:'DIMENSION'
};
const TOOLS = [
  ['select','Select','V','<path d="M5 3l12 7-5 1.5L15 18l-2.5 1-3-6.5L5 16z"/>'],
  ['booth','Booth','B','<rect x="3" y="5" width="18" height="14" fill="#ddd"/>'],
  ['fixture','Fixture','F','<rect x="5" y="9" width="14" height="7" fill="#999"/>'],
  ['zone','Zone','Z','<rect x="3" y="5" width="18" height="14" stroke-dasharray="3 2"/>'],
  ['hatch','Lane','H','<rect x="3" y="7" width="18" height="10"/><path d="M6 17l6-10M11 17l6-10M16 17l4-7"/>'],
  ['line','Line','L','<path d="M4 19L20 5" stroke-width="2.5"/>'],
  ['text','Text','T','<path d="M5 6h14M12 6v13"/>'],
  ['door','Door','D','<path d="M5 19V5"/><path d="M5 5a14 14 0 0 1 14 14" stroke-dasharray="2 2"/><path d="M4 19h16"/>'],
  ['opening','Opening','O','<path d="M3 12h4M17 12h4M7 8v8M17 8v8"/>'],
  ['dim','Dimension','M','<path d="M4 14h16M4 10v8M20 10v8"/><path d="M9 9h6" stroke-width="1"/>']
];

/* ---------- state ---------- */

const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const tabsEl = document.getElementById('tabs');
const snapBox = document.getElementById('snap');
let doc = null, sel = null, tool = 'select', drag = null, spaceDown = false;
let view = null;
let undoStack = [], redoStack = [], lastUndoKey = null;

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blankSheet(){
  return {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title:'CONCEPT FLOOR PLAN', project:'', sheetName:'OVERHEAD FLOOR PLAN', drawnBy:'', date:today(), rev:'A', sheetNo:'',
    orient:'landscape', paper:'letter', scaleMode:'nts', scaleQty:1, scaleUnit:'ft', grid:8,
    stamp:true, stampText:'REFERENCE ONLY', stampSub:'UNOFFICIAL CONCEPT',
    footer:'REFERENCE ONLY · UNOFFICIAL CONCEPT SKETCH · NOT AN APPROVED LAYOUT', legend:true, items:[]};
}
function blankDoc(){ return {version:2, cur:0, sheets:[blankSheet()]}; }
function migrate(d){
  if (d && Array.isArray(d.sheets) && d.sheets.length){
    d.sheets = d.sheets.map(s => Object.assign(blankSheet(), s, {items:Array.isArray(s.items)?s.items:[]}));
    d.version = 2; d.cur = Math.min(Math.max(d.cur|0,0), d.sheets.length-1); return d;
  }
  if (d && Array.isArray(d.items) && d.sheet){ return {version:2, cur:0, sheets:[Object.assign(blankSheet(), d.sheet, {items:d.items})]}; }
  throw new Error('not a blueprint file');
}
function sampleDoc(){
  const d = blankDoc(), s = d.sheets[0];
  s.title = 'SAMPLE LAYOUT';
  const add = (o) => { o.id = 'i'+(nextId++); s.items.push(o); };
  add({type:'line', x1:64, y1:72, x2:776, y2:72, stroke:'solid', weight:4});
  add({type:'line', x1:64, y1:72, x2:64, y2:720, stroke:'solid', weight:4});
  add({type:'line', x1:64, y1:720, x2:776, y2:720, stroke:'solid', weight:4});
  add(Object.assign({type:'booth', x:96, y:104}, DEFAULTS.booth, {w:280, h:176, label:'BOOTH 1'}));
  add(Object.assign({type:'booth', x:96, y:280}, DEFAULTS.booth, {w:160, h:64, label:'MIXING BOOTH', fontSize:12}));
  add(Object.assign({type:'fixture', x:264, y:296}, DEFAULTS.fixture, {w:56, h:40, label:'5 STACK'}));
  add(Object.assign({type:'zone', x:96, y:480}, DEFAULTS.zone, {w:240, h:120, label:'STAGING AREA'}));
  add(Object.assign({type:'hatch', x:64, y:640}, DEFAULTS.hatch, {w:440, h:48, label:'EMERGENCY LANE — KEEP CLEAR'}));
  add(Object.assign({type:'door', x:536, y:688}, DEFAULTS.door));
  add(Object.assign({type:'opening', x:616, y:716}, DEFAULTS.opening, {w:40}));
  add({type:'dim', x1:96, y1:96, x2:376, y2:96, label:''});
  add(Object.assign({type:'text', x:440, y:120}, DEFAULTS.text, {label:'SHOP CONTINUES EAST', fontSize:11}));
  return d;
}
function sh(){ return doc.sheets[doc.cur]; }
function items(){ return sh().items; }
function fixIds(){
  nextId = 1;
  const all = doc.sheets.flatMap(s => s.items);
  for (const it of all){ const n = parseInt(String(it.id||'').slice(1),10); if (n >= nextId) nextId = n+1; }
  const seen = new Set();
  for (const it of all){ if (!it.id || seen.has(it.id)) it.id = 'i'+(nextId++); seen.add(it.id); }
}

/* ---------- geometry ---------- */
function geo(s){
  const port = s.orient === 'portrait', tab = s.paper === 'tabloid';
  const long = tab ? 1632 : 1056, short = tab ? 1056 : 816;   // 96 px per inch
  const W = port ? short : long, H = port ? long : short, colW = port && !tab ? 196 : 212, colX = W - 16 - colW;
  return {W, H, colX, colW, area:{x:16, y:16, w:colX-16, h:H-32}};
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function r(n){ return Math.round(n*100)/100; }
function grid(s){ return (s||sh()).grid || 8; }
function snap(v){ return snapBox.checked ? Math.round(v/grid())*grid() : Math.round(v); }
function snapLen(v){ return snapBox.checked ? Math.max(grid(), Math.round(v/grid())*grid()) : Math.max(2, Math.round(v)); }
function byId(id){ return items().find(i => i.id === id); }
function isLine(it){ return it.type==='line' || it.type==='dim'; }
function textLines(s){ return String(s||'').split('\n'); }
function textW(s, size){ return Math.max(...textLines(s).map(l => l.length)) * size * 0.66; }
function bbox(it){
  if (isLine(it)) return {x:Math.min(it.x1,it.x2), y:Math.min(it.y1,it.y2), w:Math.abs(it.x2-it.x1), h:Math.abs(it.y2-it.y1)};
  if (it.type === 'text'){ const n=textLines(it.label).length; return {x:it.x, y:it.y, w:Math.max(textW(it.label,it.fontSize),8), h:n*it.fontSize*1.25}; }
  return {x:it.x, y:it.y, w:it.w, h:it.h};
}
function center(it){ const b = bbox(it); return {x:b.x+b.w/2, y:b.y+b.h/2}; }
function rotPt(x, y, c, deg){
  const a = deg*Math.PI/180, cs = Math.cos(a), sn = Math.sin(a), dx = x-c.x, dy = y-c.y;
  return {x:c.x + dx*cs - dy*sn, y:c.y + dx*sn + dy*cs};
}
function corners(it){
  const b = bbox(it), c = center(it), rt = it.rot || 0;
  return {nw:rotPt(b.x,b.y,c,rt), ne:rotPt(b.x+b.w,b.y,c,rt), se:rotPt(b.x+b.w,b.y+b.h,c,rt), sw:rotPt(b.x,b.y+b.h,c,rt)};
}
function rotAttr(it){ if (!it.rot) return ''; const c = center(it); return ` transform="rotate(${it.rot} ${r(c.x)} ${r(c.y)})"`; }

function fmtLen(px, s){
  s = s || sh();
  const sq = px / grid(s);
  if (s.scaleMode !== 'scaled') return (Math.round(sq*10)/10) + ' SQ';
  const units = sq * (Number(s.scaleQty)||1);
  if (s.scaleUnit === 'm') return units.toFixed(2) + ' m';
  let inches = s.scaleUnit === 'ft' ? units*12 : units;
  inches = Math.round(inches*2)/2;
  const ft = Math.floor(inches/12), inch = r(inches - ft*12);
  return ft ? `${ft}'-${inch}"` : `${inch}"`;
}

/* ---------- rendering ---------- */
function defs(s, withFont){
  const g = grid(s), a = geo(s).area;
  const font = withFont ? `<style>${document.getElementById('fontcss').textContent}</style>` : '';
  return `<defs>${font}
<pattern id="bp-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="10" fill="#000" fill-opacity="0.14"/></pattern>
<pattern id="bp-grid-minor" width="${g}" height="${g}" patternUnits="userSpaceOnUse"><path d="M ${g} 0 L 0 0 0 ${g}" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="0.5"/></pattern>
<pattern id="bp-grid" width="${g*5}" height="${g*5}" patternUnits="userSpaceOnUse" x="${a.x}" y="${a.y}"><rect width="${g*5}" height="${g*5}" fill="url(#bp-grid-minor)"/><path d="M ${g*5} 0 L 0 0 0 ${g*5}" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="0.6"/></pattern>
</defs>`;
}
function labelSvg(cx, cy, label, size, bold, vertical, backing){
  const lines = textLines(label).filter((l,i,a) => !(a.length===1 && l===''));
  if (!lines.length) return '';
  const lh = size*1.25, y0 = cy - (lines.length-1)*lh/2;
  let back = '';
  if (backing){ const w = textW(label,size) + 12, h = lines.length*lh + 4; back = `<rect x="${r(cx-w/2)}" y="${r(cy-h/2)}" width="${r(w)}" height="${r(h)}" fill="#ffffff"/>`; }
  const tsp = lines.map((l,i) => `<tspan x="${r(cx)}" y="${r(y0+i*lh)}">${esc(l)}</tspan>`).join('');
  const t = `<text text-anchor="middle" dominant-baseline="central" font-size="${size}" font-weight="${bold?700:400}" fill="${INK}" letter-spacing="0.06em">${tsp}</text>`;
  return vertical ? `<g transform="rotate(-90 ${r(cx)} ${r(cy)})">${back}${t}</g>` : back + t;
}
function dashFor(style, w){ return style==='dashed' ? ` stroke-dasharray="${r(w*3)} ${r(w*2)}"` : ''; }

function doorLocal(it){
  const w = it.w, h = it.h, out = {lines:[], arcs:[]};
  if (it.double){
    const s = w/2;
    out.lines.push([0,h,0,h-s],[w,h,w,h-s]);
    out.arcs.push({cx:0, cy:h, rad:s, a0:-90, a1:0}, {cx:w, cy:h, rad:s, a0:-90, a1:-180});
  } else {
    out.lines.push([0,h,0,0]);
    out.arcs.push({cx:0, cy:h, rad:w, a0:-90, a1:0});
  }
  return out;
}
function doorTf(it){
  const w = it.w, h = it.h;
  let tf = `translate(${it.x} ${it.y}) rotate(${it.rot||0} ${w/2} ${h/2})`;
  if (it.flip) tf += ` translate(${w} 0) scale(-1 1)`;
  return tf;
}
function doorToSheet(it, lx, ly){
  let x = it.flip ? it.w - lx : lx, y = ly;
  const p = rotPt(x, y, {x:it.w/2, y:it.h/2}, it.rot||0);
  return {x:p.x + it.x, y:p.y + it.y};
}

function renderItem(it, screen, s){
  const id = ` data-id="${it.id}"`;
  switch (it.type){
    case 'booth': case 'fixture': case 'zone': case 'hatch': {
      const f = FILLS[it.fill];
      const fill = f ? `fill="${f}"` : `fill="#ffffff" fill-opacity="0"`;
      const stroke = it.stroke==='none' ? 'stroke="none"' : `stroke="${INK}" stroke-width="${it.weight}"${dashFor(it.stroke,it.weight)}`;
      return `<g${id}${rotAttr(it)}><rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" ${fill} ${stroke}/>` +
        labelSvg(it.x+it.w/2, it.y+it.h/2, it.label, it.fontSize, it.bold, it.vertical, it.fill==='hatch') + `</g>`;
    }
    case 'line': {
      const hit = screen ? `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="#000" stroke-opacity="0" stroke-width="12"/>` : '';
      return `<g${id}>${hit}<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${INK}" stroke-width="${it.weight}" stroke-linecap="square"${dashFor(it.stroke,it.weight)}/></g>`;
    }
    case 'dim': {
      const d = dimGeom(it, s);
      const hit = screen ? `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="#000" stroke-opacity="0" stroke-width="12"/>` : '';
      return `<g${id}>${hit}<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${INK}" stroke-width="1"/>` +
        d.ticks.map(t => `<line x1="${r(t[0])}" y1="${r(t[1])}" x2="${r(t[2])}" y2="${r(t[3])}" stroke="${INK}" stroke-width="1"/>`).join('') +

  } else it.rot = ((((it.rot||0) + deg) % 360) + 360) % 360;
  render(); renderPanel();
}

/* ---------- panel ---------- */
function inp(label, f, val, type, target, extra){
  type = type || 'text'; target = target || 'item'; extra = extra || '';
  if (type === 'textarea') return `<label class="field"><span>${label}</span><textarea data-t="${target}" data-f="${f}" rows="2" ${extra}>${esc(val)}</textarea></label>`;
  if (type === 'checkbox') return `<label class="chk" style="margin:0 12px 8px 0"><input type="checkbox" data-t="${target}" data-f="${f}" ${val?'checked':''}> ${label}</label>`;
  return `<label class="field"><span>${label}</span><input type="${type}" data-t="${target}" data-f="${f}" value="${esc(val)}" ${extra}></label>`;
}
function selF(label, f, val, opts, target){
  return `<label class="field"><span>${label}</span><select data-t="${target||'item'}" data-f="${f}">` +
    opts.map(([v,t]) => `<option value="${v}" ${String(v)===String(val)?'selected':''}>${t}</option>`).join('') + `</select></label>`;
}
const NAMES = {booth:'Booth / enclosure', fixture:'Cabinet / fixture', zone:'Zone (dashed)', hatch:'Keep-clear lane', line:'Line / wall', text:'Text', door:'Swing door', opening:'Open doorway', dim:'Dimension'};
function rotRow(it){
  return `<div class="row">${inp('Rotation (°)', 'rot', it.rot||0, 'number', 'item', 'step="15"')}<div class="btns" style="margin-top:18px"><button data-act="rotl" aria-label="Rotate left 90 degrees">⟲ 90</button><button data-act="rotr" aria-label="Rotate right 90 degrees">⟳ 90</button></div></div>`;
}
function renderPanel(){
  const it = sel && byId(sel);
  let h = '';
  if (it){
    h += `<h2>${NAMES[it.type]}</h2>`;
    if (BOX_TYPES.includes(it.type)){
      h += selF('Type (sets legend entry)', 'type', it.type, BOX_TYPES.map(t => [t, NAMES[t]]));
      h += inp('Label', 'label', it.label, 'textarea');
      h += `<div class="row">${inp('Font size', 'fontSize', it.fontSize, 'number', 'item', 'min="6" max="48" step="1"')}${selF('Fill','fill',it.fill,[['none','None'],['white','White'],['light','Light gray'],['dark','Dark gray'],['hatch','Hatch stripes']])}</div>`;
      h += `<div class="row">${selF('Outline','stroke',it.stroke,[['solid','Solid'],['dashed','Dashed'],['none','None']])}${selF('Weight','weight',it.weight,[[1,'1'],[1.5,'1.5'],[2,'2'],[3,'3'],[4,'4']])}</div>`;
      h += inp('Bold', 'bold', it.bold, 'checkbox') + inp('Vertical label', 'vertical', it.vertical, 'checkbox');
      h += posFields(it) + rotRow(it);
    } else if (it.type === 'line'){
      h += `<div class="row">${selF('Style','stroke',it.stroke,[['solid','Solid'],['dashed','Dashed']])}${selF('Weight','weight',it.weight,[[1,'1 thin'],[1.5,'1.5'],[2,'2'],[3,'3'],[4,'4 wall'],[6,'6']])}</div>`;
      h += lineFields(it) + `<div class="btns"><button data-act="rotl">⟲ 90</button><button data-act="rotr">⟳ 90</button></div><p class="note">Weight 3+ shows as WALL in the legend. Hold <kbd>Shift</kbd> while dragging an end to keep it straight.</p>`;
    } else if (it.type === 'dim'){
      h += inp('Label (blank = automatic length)', 'label', it.label, 'text');
      h += lineFields(it) + `<div class="btns"><button data-act="rotl">⟲ 90</button><button data-act="rotr">⟳ 90</button></div><p class="note">Automatic length uses this sheet's scale (deselect to see sheet settings). Currently reads <b>${esc(fmtLen(Math.hypot(it.x2-it.x1,it.y2-it.y1)))}</b>.</p>`;
    } else if (it.type === 'text'){
      h += inp('Text', 'label', it.label, 'textarea');
      h += `<div class="row">${inp('Font size', 'fontSize', it.fontSize, 'number', 'item', 'min="6" max="72" step="1"')}<div style="padding-top:22px">${inp('Bold','bold',it.bold,'checkbox')}</div></div>`;
      h += `<div class="row">${inp('X','x',it.x,'number')}${inp('Y','y',it.y,'number')}</div>` + rotRow(it);
    } else if (it.type === 'door'){
      h += `<div class="row">${inp('Width', 'w', it.w, 'number', 'item', 'min="8" step="8"')}<div></div></div>`;
      h += inp('Double door', 'double', it.double, 'checkbox') + inp('Mirror hinge', 'flip', it.flip, 'checkbox') + inp('Cut wall line', 'cut', it.cut, 'checkbox');
      h += `<div class="row">${inp('X','x',it.x,'number')}${inp('Y','y',it.y,'number')}</div>` + rotRow(it);
      h += `<p class="note">Place doors after walls (or use <b>To front</b>) so the wall cut shows.</p>`;
    } else if (it.type === 'opening'){
      h += posFields(it) + rotRow(it) + `<p class="note">Wider than tall = gap in a horizontal wall; taller than wide = vertical wall.</p>`;
    }
    h += `<div class="btns"><button data-act="dup">Duplicate</button><button data-act="del">Delete</button><button data-act="front">To front</button><button data-act="back">To back</button></div>`;
    h += `<p class="note"><kbd>Del</kbd> delete · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · arrows nudge (<kbd>Shift</kbd> = 1 px) · <kbd>R</kbd>/<kbd>Shift</kbd>+<kbd>R</kbd> rotate · <kbd>Esc</kbd> deselect</p>`;
  } else {
    const s = sh(), n = doc.sheets.length;
    h += `<h2>Sheet ${doc.cur+1} of ${n}</h2>`;
    h += inp('Title', 'title', s.title, 'textarea', 'sheet');
    h += inp('Project', 'project', s.project, 'text', 'sheet');
    h += inp('Sheet', 'sheetName', s.sheetName, 'text', 'sheet');
    h += `<div class="row">${inp('Drawn by','drawnBy',s.drawnBy,'text','sheet')}${inp('Date','date',s.date,'text','sheet')}</div>`;
    h += `<div class="row">${inp('Rev','rev',s.rev,'text','sheet')}${inp('Sheet no. (blank = auto)','sheetNo',s.sheetNo,'text','sheet')}</div>`;
    h += `<div class="row">${selF('Paper', 'paper', s.paper, [['letter','Letter 8.5 × 11'],['tabloid','Tabloid 11 × 17']], 'sheet')}${selF('Orientation', 'orient', s.orient, [['landscape','Landscape'],['portrait','Portrait']], 'sheet')}</div>`;
    h += `<p class="note">Changing paper or orientation keeps items where they are, so you may need to move or resize them. Tabloid prints need a printer that takes 11 × 17 (often called Tabloid or Ledger in the print dialog).</p>`;
    h += `<h3>Scale</h3>`;
    h += selF('Mode', 'scaleMode', s.scaleMode, [['nts','Not to scale'],['scaled','True to scale']], 'sheet');
    if (s.scaleMode === 'scaled') h += `<div class="row">${inp('1 grid square =','scaleQty',s.scaleQty,'number','sheet','min="0.01" step="any"')}${selF('Unit','scaleUnit',s.scaleUnit,[['in','in'],['ft','ft'],['m','m']],'sheet')}</div>`;
    h += selF('Grid size', 'grid', s.grid, [[4,'Fine (4 px)'],[8,'Normal (8 px)'],[16,'Coarse (16 px)']], 'sheet');
    h += `<p class="note">True to scale: dimensions read in real units and DXF export uses real sizes. Changing the grid size changes what one square means.</p>`;
    h += `<h3>Stamp, legend, footer</h3>`;
    h += inp('Show "reference only" stamp', 'stamp', s.stamp, 'checkbox', 'sheet') + inp('Show legend', 'legend', s.legend, 'checkbox', 'sheet');
    h += inp('Stamp text', 'stampText', s.stampText, 'text', 'sheet');
    h += inp('Stamp subtext', 'stampSub', s.stampSub, 'text', 'sheet');
    h += inp('Footer', 'footer', s.footer, 'textarea', 'sheet');
    h += `<h3>Sheets</h3><div class="btns"><button data-act="sdup">Duplicate sheet</button><button data-act="sdel" ${n<2?'disabled':''}>Delete sheet</button><button data-act="sleft" ${doc.cur===0?'disabled':''}>◀ Move</button><button data-act="sright" ${doc.cur===n-1?'disabled':''}>Move ▶</button></div>`;
    h += `<h3>Shortcuts</h3><p class="note">${TOOLS.map(t => `<kbd>${t[2]}</kbd> ${t[1]}`).join(' · ')}<br><kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd> undo/redo · <kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Space</kbd>+drag pan · <kbd>PgUp</kbd>/<kbd>PgDn</kbd> switch sheet</p>`;
  }
  panel.innerHTML = h;
}
function posFields(it){ return `<div class="row">${inp('X','x',it.x,'number')}${inp('Y','y',it.y,'number')}</div><div class="row">${inp('Width','w',it.w,'number','item','min="2"')}${inp('Height','h',it.h,'number','item','min="2"')}</div>`; }
function lineFields(it){ return `<div class="row">${inp('X1','x1',it.x1,'number')}${inp('Y1','y1',it.y1,'number')}</div><div class="row">${inp('X2','x2',it.x2,'number')}${inp('Y2','y2',it.y2,'number')}</div>`; }
function focusLabel(selectAll){ const el = panel.querySelector('[data-f="label"]'); if (el){ el.focus(); if (selectAll && el.select) el.select(); } }

panel.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f; if (!f) return;
  const isSheet = el.dataset.t === 'sheet';
  const obj = isSheet ? sh() : byId(sel); if (!obj) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'number' || ['weight','grid'].includes(f)) { v = parseFloat(el.value); if (!isFinite(v)) return; }
  else v = el.value;
  pushUndo((isSheet ? 'sheet'+doc.cur : sel) + ':' + f);
  if (f === 'type' && !isSheet){ const d = DEFAULTS[v]; obj.type = v; obj.fill = d.fill; obj.stroke = d.stroke; obj.weight = d.weight; render(); renderPanel(); return; }
  obj[f] = v;
  if (!isSheet && obj.type === 'door' && (f === 'w' || f === 'double')) obj.h = obj.double ? obj.w/2 : obj.w;
  if (isSheet && (f === 'orient' || f === 'paper')){ fit(); }
  render();
  if (isSheet && (f === 'title')) renderTabs();
  if (isSheet && (f === 'scaleMode' || f === 'orient' || f === 'paper')) renderPanel();
});
panel.addEventListener('focusout', () => { lastUndoKey = null; });

/* ---------- actions ---------- */
function duplicate(){
  const it = sel && byId(sel); if (!it) return; pushUndo();
  const c = JSON.parse(JSON.stringify(it)); c.id = 'i'+(nextId++);
  const g = grid()*2;
  if (isLine(c)){ c.x1 += g; c.y1 += g; c.x2 += g; c.y2 += g; } else { c.x += g; c.y += g; }
  items().push(c); sel = c.id; render(); renderPanel();
}
function del(){ if (!sel) return; pushUndo(); sh().items = items().filter(i => i.id !== sel); sel = null; render(); renderPanel(); }
function reorder(front){
  const it = sel && byId(sel); if (!it) return; pushUndo();
  sh().items = items().filter(i => i !== it);
  if (front) items().push(it); else items().unshift(it);
  render();
}
function sheetDup(){
  pushUndo(); const c = JSON.parse(JSON.stringify(sh()));
  c.id = blankSheet().id; c.title = textLines(c.title)[0] + ' (COPY)';
  c.items.forEach(i => i.id = 'i'+(nextId++));
  doc.sheets.splice(doc.cur+1, 0, c); switchSheet(doc.cur+1);
}
function sheetDel(){
  if (doc.sheets.length < 2) return;
  if (!confirm('Delete this sheet? (Undo can bring it back.)')) return;
  pushUndo(); doc.sheets.splice(doc.cur, 1); switchSheet(Math.max(0, doc.cur-1));
}
function sheetMove(d){
  const j = doc.cur + d; if (j < 0 || j >= doc.sheets.length) return;
  pushUndo(); const a = doc.sheets; [a[doc.cur], a[j]] = [a[j], a[doc.cur]]; doc.cur = j; render(); renderTabs(); renderPanel();
}
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function slug(t){ return (t || 'blueprint').split('\n')[0].trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase() || 'blueprint'; }
function fileBase(){ return slug(doc.sheets[0].title); }
function sheetBase(){ return slug(sh().title); }
function svgToCanvas(s, scale){
  return new Promise((res, rej) => {
    const G = geo(s), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(G.W*scale); c.height = Math.round(G.H*scale);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c);
    };
    img.onerror = () => rej(new Error('render failed'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sheetSvg(s, true, false));
  });
}
async function exportPng(){
  try { const c = await svgToCanvas(sh(), 3); c.toBlob(b => b ? download(sheetBase()+'.png', b) : (statusEl.textContent = 'PNG export failed'), 'image/png'); }
  catch(e){ statusEl.textContent = 'PNG export failed'; }
}

/* PDF: each sheet rendered at 300 dpi, grayscale, lossless (Flate) */
async function deflate(bytes){
  const cs = new CompressionStream('deflate');
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
}
async function exportPdf(){
  if (typeof CompressionStream === 'undefined'){ alert('This browser cannot build PDFs directly. Use Print → Save as PDF instead.'); return; }
  statusEl.textContent = 'Building PDF…';
  try {
    const enc = new TextEncoder(), parts = [], offsets = [];
    let len = 0;
    const put = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    const obj = (n, body) => { offsets[n] = len; put(`${n} 0 obj\n`); body(); put(`\nendobj\n`); };
    const n = doc.sheets.length;
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => put(`<< /Type /Pages /Count ${n} /Kids [${doc.sheets.map((_,i) => `${3+i*3} 0 R`).join(' ')}] >>`));
    for (let i = 0; i < n; i++){
      const s = doc.sheets[i], G = geo(s), k = 300/96;
      const c = await svgToCanvas(s, k), W = c.width, H = c.height;
      const px = c.getContext('2d').getImageData(0, 0, W, H).data, gray = new Uint8Array(W*H);
      for (let j = 0, q = 0; j < gray.length; j++, q += 4) gray[j] = (px[q]*299 + px[q+1]*587 + px[q+2]*114) / 1000;
      const z = await deflate(gray);
      const wpt = G.W*0.75, hpt = G.H*0.75, content = `q ${wpt} 0 0 ${hpt} 0 0 cm /Im0 Do Q`;
      obj(3+i*3, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt} ${hpt}] /Resources << /XObject << /Im0 ${5+i*3} 0 R >> >> /Contents ${4+i*3} 0 R >>`));
      obj(4+i*3, () => put(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
      obj(5+i*3, () => { put(`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ${z.length} >>\nstream\n`); put(z); put('\nendstream'); });
      statusEl.textContent = `Building PDF… sheet ${i+1} of ${n}`;
    }
    const total = 3 + n*3, xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
    put(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    download(fileBase()+'.pdf', new Blob(parts, {type:'application/pdf'}));
    statusEl.textContent = `PDF downloaded (${n} sheet${n>1?'s':''})`;
  } catch(e){ console.error(e); statusEl.textContent = 'PDF export failed — use Print → Save as PDF'; }
}

/* DXF (R12 ASCII): current sheet's drawing items; real units when true to scale */
function exportDxf(){
  const s = sh(), g = grid(s);
  let f, ins, unitNote;
  if (s.scaleMode === 'scaled'){
    const per = (Number(s.scaleQty)||1) / g;
    if (s.scaleUnit === 'm'){ f = per; ins = 6; unitNote = 'meters'; }
    else { f = s.scaleUnit === 'ft' ? per*12 : per; ins = 1; unitNote = 'inches (real size)'; }
  } else {
    f = 1/96; ins = 1; unitNote = 'inches of paper (sheet is not to scale)';
  }
  const X = x => (x*f).toFixed(4), Y = y => (-y*f).toFixed(4);
  const ASCII = {'·':'-','×':'x','½':'1/2','¾':'3/4','¼':'1/4','⅛':'1/8','–':'-','—':'-','≈':'~','←':'<-','→':'->','↓':'v','↑':'^','°':' deg','“':'"','”':'"','‘':"'",'’':"'",'…':'...'};
  const asc = str => String(str).replace(/[^\x20-\x7E]/g, ch => ASCII[ch] != null ? ASCII[ch] : '?');
  const out = [];
  const p = (c, v) => out.push(String(c), String(v));
  const line = (x1,y1,x2,y2,layer,dashed) => { p(0,'LINE'); p(8,layer); if (dashed) p(6,'DASHED'); p(10,X(x1)); p(20,Y(y1)); p(30,0); p(11,X(x2)); p(21,Y(y2)); p(31,0); };
  const poly = (pts,closed,layer,dashed) => { p(0,'POLYLINE'); p(8,layer); if (dashed) p(6,'DASHED'); p(66,1); p(10,0); p(20,0); p(30,0); p(70,closed?1:0);
    for (const q of pts){ p(0,'VERTEX'); p(8,layer); p(10,X(q.x)); p(20,Y(q.y)); p(30,0); } p(0,'SEQEND'); p(8,layer); };
  const text = (x,y,size,str,rot,layer,centered) => {
    if (!str) return;
    p(0,'TEXT'); p(8,layer); p(10,X(x)); p(20,Y(y)); p(30,0); p(40,(size*0.72*f).toFixed(4)); p(1,asc(str.replace(/[\r\n]/g,' ')));
    if (rot) p(50, (-rot).toFixed(2));
    if (centered){ p(72,1); p(73,2); p(11,X(x)); p(21,Y(y)); p(31,0); }
  };
  const arcPts = (a, map) => { const pts = []; for (let i = 0; i <= 16; i++){ const t = (a.a0 + (a.a1-a.a0)*i/16)*Math.PI/180; pts.push(map(a.cx + a.rad*Math.cos(t), a.cy + a.rad*Math.sin(t))); } return pts; };
  const LAYER = {booth:'BOOTHS', fixture:'FIXTURES', zone:'ZONES', hatch:'LANES'};
  for (const it of s.items){
    if (BOX_TYPES.includes(it.type)){
      const c = corners(it), ce = center(it);
      if (it.stroke !== 'none') poly([c.nw,c.ne,c.se,c.sw], true, LAYER[it.type], it.stroke === 'dashed');
      const lines = textLines(it.label).filter(Boolean), lh = it.fontSize*1.25;
      const trot = (it.rot||0) + (it.vertical ? -90 : 0);
      lines.forEach((l,i) => { const q = rotPt(ce.x, ce.y + (i-(lines.length-1)/2)*lh, ce, trot); text(q.x, q.y, it.fontSize, l, trot, 'TEXT', true); });
    } else if (it.type === 'line'){
      line(it.x1,it.y1,it.x2,it.y2, it.weight >= 3 ? 'WALLS' : 'LINES', it.stroke === 'dashed');
    } else if (it.type === 'dim'){
      const d = dimGeom(it, s);
      line(it.x1,it.y1,it.x2,it.y2,'DIMS'); d.ticks.forEach(t => line(t[0],t[1],t[2],t[3],'DIMS'));
      text(d.mx, d.my, 10, d.label, d.ang, 'DIMS', true);
    } else if (it.type === 'text'){
      const lh = it.fontSize*1.25, c = center(it);
      textLines(it.label).forEach((l,i) => { const q = rotPt(it.x, it.y + i*lh + lh*0.78, c, it.rot||0); text(q.x, q.y, it.fontSize, l, it.rot||0, 'TEXT', false); });
    } else if (it.type === 'door'){
      const gl = doorLocal(it), map = (lx,ly) => doorToSheet(it, lx, ly);
      gl.lines.forEach(l => { const a = map(l[0],l[1]), b = map(l[2],l[3]); line(a.x,a.y,b.x,b.y,'DOORS'); });
      gl.arcs.forEach(a => poly(arcPts(a, map), false, 'DOORS', true));
    } else if (it.type === 'opening'){
      const c = center(it);
      openingJambs(it).forEach(l => { const a = rotPt(l[0],l[1],c,it.rot||0), b = rotPt(l[2],l[3],c,it.rot||0); line(a.x,a.y,b.x,b.y,'OPENINGS'); });
    }
  }
  const layers = ['WALLS','LINES','BOOTHS','FIXTURES','ZONES','LANES','DOORS','OPENINGS','DIMS','TEXT'];
  const dash = (6*f).toFixed(4), gap = (4*f).toFixed(4);
  const hdr = [];
  const h = (c, v) => hdr.push(String(c), String(v));
  h(999, asc(`Blueprint Sketcher export - ${(s.title||'').replace(/\n/g,' ')} - units: ${unitNote}`));
  h(0,'SECTION'); h(2,'HEADER'); h(9,'$ACADVER'); h(1,'AC1009'); h(9,'$INSUNITS'); h(70,ins); h(0,'ENDSEC');
  h(0,'SECTION'); h(2,'TABLES');
  h(0,'TABLE'); h(2,'LTYPE'); h(70,2);
  h(0,'LTYPE'); h(2,'CONTINUOUS'); h(70,0); h(3,'Solid line'); h(72,65); h(73,0); h(40,'0.0');
  h(0,'LTYPE'); h(2,'DASHED'); h(70,0); h(3,'Dashed'); h(72,65); h(73,2); h(40,(6*f+4*f).toFixed(4)); h(49,dash); h(49,'-'+gap);
  h(0,'ENDTAB');
  h(0,'TABLE'); h(2,'LAYER'); h(70,layers.length);
  for (const L of layers){ h(0,'LAYER'); h(2,L); h(70,0); h(62,7); h(6,'CONTINUOUS'); }
  h(0,'ENDTAB'); h(0,'ENDSEC');
  h(0,'SECTION'); h(2,'ENTITIES');
  const tail = ['0','ENDSEC','0','EOF'];
  const all = hdr.concat(out, tail);
  let txt = ''; for (let i = 0; i < all.length; i += 2) txt += all[i] + '\r\n' + all[i+1] + '\r\n';
  download(sheetBase()+'.dxf', new Blob([txt], {type:'application/dxf'}));
  statusEl.textContent = 'DXF exported — units: ' + unitNote;
}

function saveFile(){ download(fileBase() + '.blueprint.json', new Blob([JSON.stringify(doc, null, 1)], {type:'application/json'})); statusEl.textContent = 'Saved to downloads'; }
function openFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try { const d = migrate(JSON.parse(fr.result)); pushUndo(); doc = d; sel = null; afterLoad(); fit(); statusEl.textContent = 'Opened ' + file.name; }
    catch(err){ alert('Could not open that file: ' + err.message); }
  };
  fr.readAsText(file);
}
function buildPrint(){
  // unique pattern ids per page: otherwise url(#bp-hatch) resolves to the hidden on-screen copy and prints blank
  document.getElementById('printArea').innerHTML = doc.sheets.map((s,i) =>
    `<div class="pg ${(s.paper === 'tabloid' ? 't' : '') + (s.orient === 'portrait' ? 'port' : 'land')}">${sheetSvg(s, false, true).replace(/bp-/g, 'pg'+i+'-')}</div>`).join('');
}
window.addEventListener('beforeprint', buildPrint);
window.addEventListener('afterprint', () => { document.getElementById('printArea').innerHTML = ''; });

document.querySelector('header').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({
    new: () => { if (confirm('Start a new document? (Undo can bring the current one back.)')){ pushUndo(); doc = blankDoc(); sel = null; afterLoad(); fit(); } },
    open: () => document.getElementById('file').click(),
    save: saveFile, undo, redo, fit,
    zoomin: () => zoomAt({x:view.x+view.w/2, y:view.y+view.h/2}, 0.8),
    zoomout: () => zoomAt({x:view.x+view.w/2, y:view.y+view.h/2}, 1.25),
    svg: () => download(sheetBase()+'.svg', new Blob([`<?xml version="1.0" encoding="UTF-8"?>\n` + sheetSvg(sh(), true, true)], {type:'image/svg+xml'})),
    png: exportPng, pdf: exportPdf, dxf: exportDxf,
    print: () => { buildPrint(); window.print(); }
  }[b.dataset.act] || (()=>{}))();
});
document.getElementById('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({dup:duplicate, del, front:() => reorder(true), back:() => reorder(false), rotl:() => rotateSel(-90), rotr:() => rotateSel(90),
    sdup:sheetDup, sdel:sheetDel, sleft:() => sheetMove(-1), sright:() => sheetMove(1)}[b.dataset.act] || (()=>{}))();
});

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && key === 's'){ e.preventDefault(); saveFile(); return; }
  if (typing){ if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (mod && key === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && key === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && key === 'd'){ e.preventDefault(); duplicate(); return; }
  if (mod) return;
  if (e.key === 'PageDown' && doc.cur < doc.sheets.length-1){ e.preventDefault(); switchSheet(doc.cur+1); return; }
  if (e.key === 'PageUp' && doc.cur > 0){ e.preventDefault(); switchSheet(doc.cur-1); return; }
  if (e.key === ' '){ spaceDown = true; e.preventDefault(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); del(); return; }
  if (e.key === 'Escape'){ if (tool !== 'select') setTool('select'); else if (sel){ sel = null; render(); renderPanel(); } return; }
  const it = sel && byId(sel);
  if (it && e.key.startsWith('Arrow')){
    e.preventDefault(); const st = e.shiftKey ? 1 : grid();
    const dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
    pushUndo('nudge:' + it.id);
    if (isLine(it)){ it.x1 += dx; it.x2 += dx; it.y1 += dy; it.y2 += dy; } else { it.x += dx; it.y += dy; }
    render(); return;
  }
  if (it && key === 'r'){ rotateSel(e.shiftKey ? -90 : 90); return; }
  const t = TOOLS.find(t => t[2].toLowerCase() === key);
  if (t) setTool(t[0]);
});
window.addEventListener('keyup', e => { if (e.key === ' ') spaceDown = false; if (e.key.startsWith('Arrow')) lastUndoKey = null; });
window.addEventListener('resize', () => render());

/* ---------- boot ---------- */
document.getElementById('tools').innerHTML = TOOLS.map(([id,name,key,icon]) =>
  `<button data-tool="${id}" title="${name} (${key})" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>${name}</button>`).join('');
document.getElementById('tools').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); });

try {
  const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_KEY);
  if (raw) doc = migrate(JSON.parse(raw));
} catch(e){ doc = null; }
if (!doc) doc = sampleDoc();
fixIds();
setTool('select');
fit(); renderTabs(); renderPanel();
statusEl.textContent = 'Works offline · autosaves in this browser';
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>
</body>
</html>
